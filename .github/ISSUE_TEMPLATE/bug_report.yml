name: Bug report / Ошибка
description: Something doesn't work / Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / Что произошло?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как воспроизвести
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / Что ожидалось
  - type: input
    id: version
    attributes:
      label: WaveAMP version / Версия WaveAMP
      description: Settings → System → About / Настройки → Системные → О программе
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Система
      placeholder: macOS 15.1, Windows 11, Ubuntu 24.04 (Wayland)…
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Логи
      description: Settings → System → Logging / Настройки → Системные → Логирование
      render: text
