name: Build installers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/check.yml

  # The three platform builds run in parallel and each used to create the
  # GitHub release itself: whichever lost the race got "422 already_exists"
  # and failed without uploading its installers (v0.14.1, v0.15.0 shipped
  # without macOS files). Create the release once, up front — electron-builder
  # then just uploads into the existing release.
  release:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.create.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        id: create
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "v$version" --title "$version" --notes "" --target "$GITHUB_SHA"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: release:mac
          - os: ubuntu-latest
            script: release:linux
          - os: windows-latest
            script: release:win

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installer
        run: npm run ${{ matrix.script }}
        env:
          # No signing certificates in CI on any platform — build
          # unsigned, don't let electron-builder go looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prune:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older releases
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --exclude-pre-releases \
            --json tagName,createdAt --jq "sort_by(.createdAt) | reverse | .[$RELEASES_TO_KEEP:] | .[].tagName" |
          while read -r tag; do
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_TO_KEEP: 2
