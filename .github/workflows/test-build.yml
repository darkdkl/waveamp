name: Test build

on:
  push:
    branches: [test]

permissions:
  contents: write

concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml

  prerelease:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate the test prerelease
        run: |
          gh release delete test-build --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create test-build --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Test build" \
            --notes "Not a release. Version $(node -p "require('./package.json').version")-test.$GITHUB_RUN_NUMBER, built from \`test\` at ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Replaced on every push to \`test\`."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prerelease
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
          - os: windows-latest
            script: build:win

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Set the test version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          npm version --no-git-tag-version "$version-test.$GITHUB_RUN_NUMBER"

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload to the test prerelease
        shell: bash
        run: |
          cd dist
          for file in *.dmg *-mac.zip *.AppImage *.exe; do
            [ -e "$file" ] || continue
            renamed="${file// /-}"
            [ "$file" = "$renamed" ] || mv "$file" "$renamed"
            gh release upload test-build "$renamed" --clobber --repo "$GITHUB_REPOSITORY"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
