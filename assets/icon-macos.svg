<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#474b52"/>
      <stop offset="0.5" stop-color="#25282d"/>
      <stop offset="1" stop-color="#15171a"/>
