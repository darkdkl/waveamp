    <path id="bars" d="M262 202Q262 192 271.39 195.44L376.61 234.01Q386 237.45 386 247.45L386 776.55Q386 786.55 376.61 789.99L271.39 828.56Q262 832 262 822ZM466 276.77Q466 266.77 475.39 270.22L580.61 308.78Q590 312.23 590 322.23L590 701.77Q590 711.77 580.61 715.22L475.39 753.78Q466 757.23 466 747.23ZM670 351.55Q670 341.55 679.39 344.99L784.61 383.56Q794 387 794 397L794 627Q794 637 784.61 640.44L679.39 679.01Q670 682.45 670 672.45Z"/>
