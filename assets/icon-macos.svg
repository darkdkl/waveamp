    <path id="bars" d="M247 174.67Q247 168.67 252.24 171.58L361.76 232.42Q367 235.33 367 241.33L367 782.67Q367 788.67 361.76 791.58L252.24 852.42Q247 855.33 247 849.33ZM427 274.67Q427 268.67 432.24 271.58L541.76 332.42Q547 335.33 547 341.33L547 682.67Q547 688.67 541.76 691.58L432.24 752.42Q427 755.33 427 749.33ZM607 374.67Q607 368.67 612.24 371.58L721.76 432.42Q727 435.33 727 441.33L727 582.67Q727 588.67 721.76 591.58L612.24 652.42Q607 655.33 607 649.33ZM787 474.67Q787 468.67 792.24 471.58L831.76 493.53Q837 496.44 837 502.44L837 521.56Q837 527.56 831.76 530.47L792.24 552.42Q787 555.33 787 549.33Z"/>
